<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamolon Osh — Fikr-mulohaza</title>
<meta name="description" content="Kamolon Osh fikr-mulohaza markazi. Murojaatingiz to'g'ridan-to'g'ri Telegram botimizga yetib boradi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8ef;
  --panel: #ffffff;
  --text: #2b1d14;
  --muted: #8a7566;
  --border: #f1e3d3;
  --field: #fff6ec;
  --brand: #ff7a1a;
  --brand-2: #ff3d6e;
  --star: #ffb800;
  --danger: #e5383b;

  --c-review: #ff9f1c;   --c-review-bg: #fff3df;
  --c-idea: #22c55e;     --c-idea-bg: #e6f9ee;
  --c-partner: #3b82f6;  --c-partner-bg: #e7f0ff;
  --c-problem: #ec4899;  --c-problem-bg: #fde8f3;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  background:
    radial-gradient(circle at 0% 0%, #ffd9b3 0, transparent 35%),
    radial-gradient(circle at 100% 100%, #ffc6d9 0, transparent 40%),
    var(--bg);
  background-attachment: fixed;
}
.shell {
  width: 100%;
  max-width: 1100px;
  background: var(--panel);
  border-radius: 26px;
  padding: 0 0 28px;
  align-self: flex-start;
  box-shadow: 0 30px 60px -30px rgba(160, 80, 20, .35);
  overflow: hidden;
}
.body { padding: 0 24px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

header {
  display: flex; align-items: center; gap: 14px;
  padding: 20px 24px;
  background: linear-gradient(120deg, var(--brand), var(--brand-2));
  color: #fff;
}
header .logo { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.22); display: grid; place-items: center; }
header .brand { font-weight: 700; font-size: 1.25rem; }
header .tag { opacity: .9; font-size: .92rem; margin-top: 3px; }
header .lang-btn {
  margin-left: auto; background: rgba(255,255,255,.22); color: #fff; border: none;
  border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 600; font-size: .85rem; cursor: pointer;
}
header .lang-btn:hover { background: rgba(255,255,255,.35); }

h1 { font-size: 1.7rem; font-weight: 700; margin: 28px 0 0; }
p.lead { color: var(--muted); font-size: 1.02rem; margin: 10px 0 22px; line-height: 1.55; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
.tile {
  --c: var(--brand); --cbg: var(--field);
  text-align: left; background: #fff; color: var(--text);
  border: 2px solid var(--border); border-radius: 20px;
  padding: 20px; font: inherit; cursor: pointer;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.tile:hover { border-color: var(--c); transform: translateY(-3px); box-shadow: 0 16px 30px -18px var(--c); }
.tile .ico { width: 52px; height: 52px; border-radius: 16px; background: var(--cbg); color: var(--c); display: grid; place-items: center; }
.tile .ico svg { width: 28px; height: 28px; }
.tile .t { font-size: 1.25rem; font-weight: 700; margin: 18px 0 8px; }
.tile .d { color: var(--muted); font-size: .95rem; }
[data-cat="review"]  { --c: var(--c-review);  --cbg: var(--c-review-bg); }
[data-cat="idea"]    { --c: var(--c-idea);    --cbg: var(--c-idea-bg); }
[data-cat="partner"] { --c: var(--c-partner); --cbg: var(--c-partner-bg); }
[data-cat="problem"] { --c: var(--c-problem); --cbg: var(--c-problem-bg); }

/* Language screen */
.langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 640px) { .langs { grid-template-columns: 1fr; } }
.langs .tile { display: flex; align-items: center; gap: 14px; }
.langs .flag { font-size: 2rem; }
.langs .t { margin: 0; font-size: 1.15rem; }
.langs .arrow { margin-left: auto; color: var(--brand); transform: rotate(180deg); }

/* Form */
.back { background: none; border: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; padding: 0; margin-top: 22px; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--brand); }
.form-head { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
.form-head h1 { margin: 0; }
form { max-width: 640px; }
label, .label { display: block; font-weight: 600; margin: 20px 0 8px; font-size: .95rem; }
.opt { color: var(--muted); font-weight: 400; }
input, textarea {
  width: 100%; padding: 14px 16px;
  border: 2px solid transparent; border-radius: 14px;
  background: var(--field); color: var(--text); font: inherit;
  transition: border-color .15s, background .15s;
}
input::placeholder, textarea::placeholder { color: #b9a596; }
textarea { min-height: 130px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: var(--brand); background: #fff; }
.rate-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; margin-bottom: 8px; background: var(--field); border-radius: 14px; }
.rate-row > span { font-weight: 500; }
.stars { display: flex; gap: 2px; }
.stars button { background: none; border: none; padding: 2px; cursor: pointer; color: #e3cdb8; transition: transform .1s; }
.stars button:hover { transform: scale(1.15); }
.stars button svg { width: 28px; height: 28px; }
.stars button.on { color: var(--star); }
.stars button.on svg { fill: var(--star); }
.send {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; margin-top: 26px; padding: 16px;
  background: linear-gradient(120deg, var(--brand), var(--brand-2)); color: #fff;
  border: none; border-radius: 16px;
  font: inherit; font-weight: 700; font-size: 1.02rem; cursor: pointer; text-decoration: none;
  box-shadow: 0 14px 26px -14px var(--brand-2);
  transition: transform .15s, box-shadow .15s;
}
.send:hover { transform: translateY(-2px); box-shadow: 0 18px 30px -14px var(--brand-2); }
.send svg { width: 20px; height: 20px; fill: currentColor; }
.note { margin-top: 12px; color: var(--danger); min-height: 1.2em; font-size: .9rem; font-weight: 500; }

.done { text-align: center; max-width: 520px; margin: 40px auto 10px; }
.done .circle { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px; background: linear-gradient(120deg, #34d399, #22c55e); color: #fff; box-shadow: 0 14px 30px -14px #22c55e; }
.done .circle svg { width: 40px; height: 40px; stroke-width: 2.4; }
.done p { color: var(--muted); line-height: 1.6; }

footer { text-align: center; margin-top: 28px; }
footer a { color: var(--muted); font-size: .88rem; font-weight: 500; text-decoration: none; margin: 0 8px; }
footer a:hover { color: var(--brand); }

/* Admin */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px; }
@media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } }
.stat { border-radius: 20px; padding: 18px 20px; color: #fff; }
.stat b { display: block; font-size: 2rem; font-weight: 800; }
.stat span { opacity: .95; font-size: .92rem; }
.stat.s1 { background: linear-gradient(135deg, #ff9f1c, #ff6b1a); }
.stat.s2 { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
.stat.s3 { background: linear-gradient(135deg, #f472b6, #e11d48); }
.stat.s4 { background: linear-gradient(135deg, #4ade80, #16a34a); }
.tabs { display: flex; gap: 8px; margin: 24px 0 16px; padding: 6px; background: var(--field); border-radius: 999px; overflow-x: auto; }
.tabs button { flex: 1; border: none; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 10px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: #fff; color: var(--text); box-shadow: 0 4px 12px -6px rgba(120,60,20,.4); }
.items { display: grid; gap: 12px; }
.item { display: flex; gap: 14px; align-items: flex-start; border: 2px solid var(--border); border-radius: 18px; padding: 16px 18px; background: #fff; }
.item .ico { width: 44px; height: 44px; border-radius: 14px; background: var(--cbg); color: var(--c); display: grid; place-items: center; flex: none; }
.item .main { flex: 1; min-width: 0; }
.item .ttl { font-weight: 700; font-size: 1.08rem; }
.item .meta { color: var(--muted); font-size: .9rem; margin-top: 6px; }
.badge { font-size: .8rem; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.badge.urgent { background: #ffe1e3; color: #d62839; }
.badge.new { background: #e0edff; color: #2563eb; }
.badge.review { background: #fff1d6; color: #b45309; }
.badge.closed { background: #dcfce7; color: #15803d; }
.demo { display: inline-block; margin-top: 12px; font-size: .85rem; color: #b45309; background: #fff1d6; padding: 6px 12px; border-radius: 999px; }

[hidden] { display: none !important; }
</style>
</head>
<body>

<!-- Line icons -->
<svg width="0" height="0" style="position:absolute">

<main class="shell">

    <div class="logo"><svg class="i"><use href="#ic-chat"/></svg></div>

      <div class="tag" data-i18n="tag">Fikr-mulohaza markazi</div>

      <button class="tile" data-cat="partner"><div class="ico"><svg class="i"><use href="#ic-hand"/></svg></div><div class="t" data-i18n="c_partner_t"></div><div class="d" data-i18n="c_partner_d"></div></button>

    </div>
  </section>

  <!-- 3. Forma -->
  <section id="s-form" hidden>
    <button class="back" data-go="home"><svg class="i"><use href="#ic-back"/></svg><span data-i18n="back"></span></button>

        <div class="rate-row" data-key="service"><span data-i18n="r_service"></span><div class="stars"></div></div>
        <div class="rate-row" data-key="atmos"><span data-i18n="r_atmos"></span><div class="stars"></div></div>
      </div>

      <label for="name"><span data-i18n="name"></span> <span class="opt" data-i18n="optional"></span></label>
      <input id="name" autocomplete="name">

      <div id="phoneWrap">
        <label for="phone"><span data-i18n="phone"></span> <span class="opt" id="phoneOpt" data-i18n="optional"></span></label>
        <input id="phone" type="tel" autocomplete="tel" placeholder="+998 __ ___ __ __">
      </div>

      <div id="companyWrap">
        <label for="company"><span data-i18n="company"></span> <span class="opt" data-i18n="optional"></span></label>
        <input id="company" autocomplete="organization">
      </div>

      <label for="msg" data-i18n="msg"></label>
      <textarea id="msg"></textarea>

      <button class="send" type="submit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13 1.4 11.5c-1-.3-1-1 .2-1.5L20.5 2.8c.9-.3 1.6.2 1.4 1.5z"/></svg>
        <span data-i18n="send"></span>
      </button>
      <div class="note" id="note"></div>
    </form>
  </section>

  <!-- 4. Rahmat -->
  <section id="s-done" hidden>
    <div class="done">
      <div class="circle"><svg class="i"><use href="#ic-check"/></svg></div>
      <h1 data-i18n="thanks"></h1>
      <p data-i18n-html="doneText"></p>
      <a class="send" id="again" href="#" target="_blank" rel="noopener"><span data-i18n="reopen"></span></a>
      <button class="back" data-go="home" style="margin-top:18px"><svg class="i"><use href="#ic-back"/></svg><span data-i18n="toHome"></span></button>
    </div>
  </section>

  <!-- 5. Murojaatlar (admin, namuna) -->
  <section id="s-admin" hidden>
    <button class="back" data-go="home"><svg class="i"><use href="#ic-back"/></svg><span data-i18n="toHome"></span></button>
    <h1 data-i18n="a_title" style="margin-top:14px"></h1>
    <span class="demo" data-i18n="a_demo"></span>
    <div class="stats">
      <div class="stat s1"><b>128</b><span data-i18n="a_total"></span></div>

      <div class="stat s3"><b>8</b><span data-i18n="a_attention"></span></div>
      <div class="stat s4"><b>103</b><span data-i18n="a_closed"></span></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-f="all" class="on" data-i18n="t_all"></button>
      <button data-f="review" data-i18n="t_review"></button>
      <button data-f="partner" data-i18n="t_partner"></button>
      <button data-f="idea" data-i18n="t_idea"></button>
      <button data-f="problem" data-i18n="t_problem"></button>
    </div>
    <div class="items" id="items"></div>
  </section>

  <footer><a href="#" id="adminLink" data-i18n="admin"></a> · <a id="direct" href="#" target="_blank" rel="noopener" data-i18n="direct">Telegram bot →</a></footer>
  </div>
</main>

      phone: "Номер телефона", company: "Название компании",
      msg: "Ваше сообщение", msgPh: "Напишите здесь...",
      send: "Отправить через Telegram",
      empty: "Пожалуйста, напишите сообщение.",
      needPhone: "Пожалуйста, укажите номер телефона.",
      thanks: "Спасибо!",
      doneText: "Наш Telegram-бот открыт. Нажмите <b>START</b>, затем вставьте (Paste) скопированный текст и отправьте.",
      reopen: "Открыть бота снова",
      direct: "Наш Telegram-бот →",
      m: { head: "📩 Новое обращение", cat: "Тема", lang: "Язык", rate: "Оценка", name: "Имя", phone: "Телефон", company: "Компания" }
    },
    en: {
      code: "EN", admin: "Requests (admin)",
      a_title: "Requests", a_demo: "Demo data", a_total: "Total requests", a_new: "New", a_attention: "Need attention", a_closed: "Closed", t_all: "All", t_review: "Reviews", t_partner: "Partners", t_idea: "Ideas", t_problem: "Problems", s_urgent: "Urgent", s_new: "New", s_review: "Under review", s_closed: "Closed",
      tag: "Feedback center",
      title: "We value your opinion",
      lead: "Choose a topic. Your message will be passed to the responsible specialist.",
      c_review_t: "Leave a review", c_review_d: "Rate the food, service and atmosphere",
      c_idea_t: "Suggest an idea", c_idea_d: "Ideas and wishes for management",
      c_partner_t: "Partnership", c_partner_d: "Suppliers, rent, partnerships",
      c_problem_t: "Solve a problem", c_problem_d: "Complaints and urgent requests",
      back: "Back", toHome: "Back to home",
      rateQ: "Your rating",
      r_food: "Food", r_service: "Service", r_atmos: "Atmosphere",
      name: "Your name", optional: "(optional)", namePh: "e.g. Aziz",
      phone: "Phone number", company: "Company name",
      msg: "Your message", msgPh: "Write here...",
      send: "Send via Telegram",
      empty: "Please write your message.",
      needPhone: "Please enter your phone number.",
      thanks: "Thank you!",
      doneText: "Our Telegram bot is open. Tap <b>START</b>, then paste the copied text and send it.",
      reopen: "Open the bot again",
      direct: "Our Telegram bot →",
      m: { head: "📩 New request", cat: "Topic", lang: "Language", rate: "Rating", name: "Name", phone: "Phone", company: "Company" }
    }
  };

  const $ = id => document.getElementById(id);
  const botUrl = "https://t.me/" + BOT_USERNAME;
  $("direct").href = botUrl;
  $("again").href = botUrl + "?start=otziv";

  let lang = "uz", cat = "review";
  const scores = { food: 0, service: 0, atmos: 0 };

  function show(name) {
    ["lang", "home", "form", "done", "admin"].forEach(s => $("s-" + s).hidden = s !== name);
    $("langBtn").hidden = name === "lang";
    window.scrollTo(0, 0);
  }

  function applyLang(l) {
    lang = l;
    const t = T[l];
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
    document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t[el.dataset.i18nHtml]);
    $("name").placeholder = t.namePh;
    $("msg").placeholder = t.msgPh;
    $("langBtn").textContent = "🌐 " + t.code;
    if (typeof renderAdmin === "function") renderAdmin();
    setCat(cat);
  }

  function setCat(c) {
    cat = c;
    const t = T[lang];
    $("formTitle").textContent = t["c_" + c + "_t"];
    $("formDesc").textContent = t["c_" + c + "_d"];
    $("formIcon").innerHTML = '<use href="#' + ICONS[c] + '"/>';
    $("formHead").dataset.cat = c;
    $("ratings").hidden = c !== "review";
    $("companyWrap").hidden = c !== "partner";
    $("phoneOpt").hidden = c === "partner" || c === "problem";
    $("note").textContent = "";
  }

  // Stars
  document.querySelectorAll(".rate-row").forEach(row => {
    const box = row.querySelector(".stars");
    for (let v = 1; v <= 5; v++) {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("aria-label", v + "/5");
      b.innerHTML = '<svg class="i"><use href="#ic-star"/></svg>';
      b.addEventListener("click", () => {
        scores[row.dataset.key] = v;
        [...box.children].forEach((s, i) => s.classList.toggle("on", i < v));
      });
      box.appendChild(b);
    }
  });

  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    applyLang(b.dataset.lang);
    show("home");
  }));
  $("langBtn").addEventListener("click", () => show("lang"));
  document.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
    setCat(b.dataset.cat);
    show("form");
  }));
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const t = T[lang], m = t.m;
    const name = $("name").value.trim();
    const phone = $("phone").value.trim();
    const company = $("company").value.trim();
    const msg = $("msg").value.trim();
    if ((cat === "partner" || cat === "problem") && !phone) { $("note").textContent = t.needPhone; return; }
    if (!msg) { $("note").textContent = t.empty; return; }

    let text = m.head + "\n" + m.cat + ": " + t["c_" + cat + "_t"] + "\n" + m.lang + ": " + t.code + "\n";
    if (cat === "review") {
      const r = [["food", t.r_food], ["service", t.r_service], ["atmos", t.r_atmos]]
        .filter(([k]) => scores[k])
        .map(([k, label]) => label + " " + "⭐".repeat(scores[k]) + " (" + scores[k] + "/5)");
      if (r.length) text += m.rate + ":\n  " + r.join("\n  ") + "\n";
    }
    if (name) text += m.name + ": " + name + "\n";
    if (phone) text += m.phone + ": " + phone + "\n";
    if (cat === "partner" && company) text += m.company + ": " + company + "\n";
    text += "\n" + msg;

    try { await navigator.clipboard.writeText(text); } catch (_) {}
    window.open(botUrl + "?start=" + cat, "_blank", "noopener");

    $("form").reset();
    Object.keys(scores).forEach(k => scores[k] = 0);
    document.querySelectorAll(".stars button").forEach(s => s.classList.remove("on"));
    show("done");
  });

  // Murojaatlar — namuna (demo) ma'lumotlar. Haqiqiy murojaatlar Telegram botga keladi.
  const ITEMS = [
    { cat: "problem", status: "urgent", t: { uz: "Sovuq osh haqida shikoyat", ru: "Жалоба на холодный плов", en: "Complaint about cold plov" },
      m: { uz: "Filial: Labzak · Baho 2/5", ru: "Филиал: Лабзак · Оценка 2/5", en: "Branch: Labzak · Rating 2/5" } },
    { cat: "partner", status: "new", t: { uz: "Yetkazib beruvchidan taklif", ru: "Предложение от поставщика", en: "Offer from a supplier" },
      m: { uz: "Toifa: Qadoqlash · Tijoriy taklif", ru: "Категория: Упаковка · Коммерческое предложение", en: "Category: Packaging · Commercial offer" } },
    { cat: "idea", status: "review", t: { uz: "Yangi taom qo'shish", ru: "Добавить новое блюдо", en: "Add a new dish" },
      m: { uz: "Filial: Gulzor · Mehmon taklifi", ru: "Филиал: Гулзор · Предложение гостя", en: "Branch: Gulzor · Guest suggestion" } },
    { cat: "review", status: "closed", t: { uz: "Ajoyib xizmat, rahmat!", ru: "Отличный сервис, спасибо!", en: "Great service, thank you!" },
      m: { uz: "Filial: Chilonzor · Baho 5/5", ru: "Филиал: Чиланзар · Оценка 5/5", en: "Branch: Chilanzar · Rating 5/5" } },
    { cat: "review", status: "new", t: { uz: "Muhit juda yoqdi", ru: "Очень понравилась атмосфера", en: "Loved the atmosphere" },
      m: { uz: "Filial: Labzak · Baho 4/5", ru: "Филиал: Лабзак · Оценка 4/5", en: "Branch: Labzak · Rating 4/5" } },
    { cat: "partner", status: "review", t: { uz: "Bino ijarasi bo'yicha", ru: "По аренде помещения", en: "About renting premises" },
      m: { uz: "Toifa: Ijara · 250 m²", ru: "Категория: Аренда · 250 м²", en: "Category: Rent · 250 m²" } }
  ];
  let filter = "all";
  function renderAdmin() {
    const t = T[lang];
    $("items").innerHTML = ITEMS.filter(i => filter === "all" || i.cat === filter).map(i => `
      <div class="item" data-cat="${i.cat}">
        <div class="ico"><svg class="i"><use href="#${ICONS[i.cat]}"/></svg></div>
        <div class="main"><div class="ttl">${i.t[lang]}</div><div class="meta">${i.m[lang]}</div></div>
        <span class="badge ${i.status}">${t["s_" + i.status]}</span>
      </div>`).join("");
  }
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    renderAdmin();
  }));
  $("adminLink").addEventListener("click", e => { e.preventDefault(); renderAdmin(); show("admin"); });

  applyLang("uz");
</script>
</body>
</html>
