<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
  // Yangi versiya chiqqan bo'lsa, sahifani avtomatik yangilaydi
  const APP_VERSION = "20261109114603";
  fetch("version.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.json())
    .then(j => {
      if (j.v === APP_VERSION) return;
      const u = new URL(location.href);
      if (u.searchParams.get("v") === j.v) return;
      u.searchParams.set("v", j.v);
      location.replace(u.toString());
    })
    .catch(() => {});
</script>
<title>Kamolon Osh markazi — Feedback</title>
<meta name="description" content="Kamolon Osh fikr-mulohaza markazi. Fikr va takliflaringizni qoldiring.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8ef;
  --panel: #ffffff;
  --text: #2b1d14;
  --muted: #8a7566;
  --border: #f1e3d3;
  --field: #fff6ec;
  --brand: #f97316;
  --brand-2: #e8503a;
  --star: #ffb800;
  --danger: #e5383b;

  --c-review: #e9a100;   --c-review-bg: #fef3c7;
  --c-idea: #f97316;     --c-idea-bg: #ffedd5;
  --c-partner: #e8503a;  --c-partner-bg: #ffe4dc;
  --c-problem: #d9304f;  --c-problem-bg: #ffe1e6;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 32px 16px;
  background:
    radial-gradient(circle at 0% 0%, #ffd9b3 0, transparent 35%),
    radial-gradient(circle at 100% 100%, #ffd2bf 0, transparent 40%),
    var(--bg);
}
.shell {
  width: 100%;
  display: flex; flex-direction: column;
  max-width: 760px;
  margin: auto 0;
  background: var(--panel);
  border-radius: 26px;
  padding: 0 0 28px;
  box-shadow: 0 30px 60px -30px rgba(160, 80, 20, .35);
  overflow: hidden;
}
.body { padding: 0 24px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

header {
  display: flex; align-items: center; gap: 14px;
  padding: 20px 24px;
  background: linear-gradient(120deg, var(--brand), var(--brand-2));
  color: #fff;
}
header .logo { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.22); display: grid; place-items: center; }
header .brand { font-weight: 900; font-size: 1.5rem; text-transform: uppercase; color: #120a05; letter-spacing: .01em; line-height: 1.1; }
header .tag { color: #2b1408; opacity: .85; font-weight: 600; font-size: .92rem; margin-top: 3px; }
header .lang-btn {
  display: grid; place-items: center;
  margin-left: auto; background: rgba(255,255,255,.22); color: #fff; border: none;
  border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 600; font-size: .85rem; cursor: pointer;
}
header .lang-btn:hover { background: rgba(255,255,255,.35); }

h1 { font-size: 1.7rem; font-weight: 700; margin: 28px 0 0; }
p.lead { color: var(--muted); font-size: 1.02rem; margin: 10px 0 22px; line-height: 1.55; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
.tile {
  --c: var(--brand); --cbg: var(--field);
  text-align: left; background: #fff; color: var(--text);
  border: 2px solid var(--border); border-radius: 20px;
  padding: 20px; font: inherit; cursor: pointer;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.tile:hover { border-color: var(--c); transform: translateY(-3px); box-shadow: 0 16px 30px -18px var(--c); }
.tile .ico { width: 52px; height: 52px; border-radius: 16px; background: var(--cbg); color: var(--c); display: grid; place-items: center; }
.tile .ico svg { width: 28px; height: 28px; }
.tile .t { font-size: 1.25rem; font-weight: 700; margin: 18px 0 8px; }
.tile .d { color: var(--muted); font-size: .95rem; }
[data-cat="review"]  { --c: var(--c-review);  --cbg: var(--c-review-bg); }
[data-cat="idea"]    { --c: var(--c-idea);    --cbg: var(--c-idea-bg); }
[data-cat="partner"] { --c: var(--c-partner); --cbg: var(--c-partner-bg); }
.grid > .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
[data-cat="problem"] { --c: var(--c-problem); --cbg: var(--c-problem-bg); }

/* Language screen */
.langs { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (max-width: 640px) { .langs { grid-template-columns: 1fr; } }
.langs .tile { display: flex; align-items: center; gap: 14px; }
.langs .flag { width: 40px; height: 28px; border-radius: 6px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
.langs .flag svg { width: 100%; height: 100%; display: block; }
.langs .t { margin: 0; font-size: 1.15rem; }
.langs .arrow { margin-left: auto; color: var(--brand); transform: rotate(180deg); }

/* Form */
.back { background: none; border: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; padding: 0; margin-top: 22px; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--brand); }
.form-head { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
.form-head h1 { margin: 0; }
form { max-width: none; }
label, .label { display: block; font-weight: 600; margin: 20px 0 8px; font-size: .95rem; }
.opt { color: var(--muted); font-weight: 400; }
input, textarea {
  width: 100%; padding: 14px 16px;
  border: 2px solid transparent; border-radius: 14px;
  background: var(--field); color: var(--text); font: inherit;
  transition: border-color .15s, background .15s;
}
input::placeholder, textarea::placeholder { color: #b9a596; }
textarea { min-height: 130px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: var(--brand); background: #fff; }
.branches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.branches button {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px; border-radius: 14px; border: 2px solid var(--border);
  background: #fff; color: var(--text); font: inherit; font-weight: 600; font-size: .95rem; cursor: pointer; text-align: left;
  transition: border-color .15s, background .15s;
}
.branches button svg { width: 18px; height: 18px; color: var(--brand); }
.branches button:hover { border-color: var(--brand); }
.branches button.on { border-color: var(--brand); background: #fff3e8; }
@media (max-width: 560px) { .branches { grid-template-columns: 1fr; } .branches button { padding: 14px 16px; font-size: 1rem; } }
.bn { display: flex; flex-direction: column; line-height: 1.25; }
.bn small { font-size: .78rem; font-weight: 500; color: var(--muted); }
.cn { font-size: 1.12em; font-weight: 800; white-space: nowrap; }
.nw { white-space: nowrap; }
.err { border-color: var(--danger) !important; background: #fff1f1 !important; }
.rate-row.err { box-shadow: inset 0 0 0 2px var(--danger); }
.ferr { color: var(--danger); font-size: .85rem; font-weight: 600; margin: 6px 2px 4px; }
.shell { position: relative; }
.admin-dot { position: relative; display: inline-block; vertical-align: middle; width: 12px; height: 12px; margin-left: 10px; padding: 0; border: none; border-radius: 50%; background: #120a05; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.admin-dot::before { content: ""; position: absolute; inset: -16px; }
.admin-top { display: flex; align-items: center; }
#pin { font-size: 1.4rem; letter-spacing: .4em; text-align: center; max-width: 260px; display: block; }
#pinForm .send { max-width: 260px; }
.tile .count { font-weight: 800; color: var(--c); font-size: 1.05rem; }
.entry { position: relative; border: 2px solid var(--border); border-radius: 16px; padding: 14px 16px; background: #fff; }
.entry.gone { opacity: .45; pointer-events: none; }
.emenu { position: absolute; top: 8px; right: 8px; }
.edots { width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer; }
.edots:hover, .emenu.open .edots { background: var(--field); color: var(--text); }
.epop { display: none; position: absolute; right: 0; top: 40px; z-index: 5; background: #fff; border: 2px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 4px; }
.emenu.open .epop { display: block; }
.edel { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: #d93636; font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.edel:hover { background: #fdecec; }
.entry .when { font-weight: 700; color: var(--brand); font-size: .92rem; margin-bottom: 8px; }
.entry .row { font-size: .93rem; margin: 4px 0; color: var(--text); }
.entry .row a { color: var(--brand); text-decoration: none; font-weight: 600; }
.entry .rates { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
.entry .rates i { font-style: normal; color: var(--star); letter-spacing: 1px; }
.entry .msg { margin-top: 8px; padding: 10px 12px; background: var(--field); border-radius: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
.datebar { display: flex; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.dbtn { width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--border); background: #fff; color: var(--text); font-size: 1.4rem; line-height: 1; cursor: pointer; }
.dbtn:disabled { opacity: .35; cursor: default; }
.dpick { position: relative; display: flex; align-items: center; height: 42px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--brand); background: #fff3e8; font-weight: 700; cursor: pointer; margin: 0; font-size: .98rem; }
.dpick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; padding: 0; border: none; }
.drange { height: 42px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--border); background: #fff; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
.datebar .rsep, .datebar .ato { display: none; }
.datebar.range .rsep { display: inline; color: var(--muted); font-weight: 700; }
.datebar.range .ato { display: flex; }
.datebar.range .aprev, .datebar.range .anext { display: none; }
.datebar.range .drange { border-color: var(--brand); color: var(--brand); }
.dtoday { height: 42px; padding: 0 14px; border-radius: 12px; border: none; background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
.arefresh.spin .rico { display: inline-block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.picked { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #fff3e8; border: 2px solid var(--brand); font-weight: 600; margin-top: 4px; }
.picked svg { width: 20px; height: 20px; color: var(--brand); flex: none; }
.picked button { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #fff !important; flex: none;
  margin-left: auto; background: none; border: none; color: var(--brand); font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer; padding: 0; white-space: nowrap; }
#fields { animation: rise .35s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rate-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; margin-bottom: 8px; background: var(--field); border-radius: 14px; }
.rate-row > span { font-weight: 500; }
.stars { display: flex; gap: 2px; }
.stars button { background: none; border: none; padding: 2px; cursor: pointer; color: #e3cdb8; transition: transform .1s; }
.stars button:hover { transform: scale(1.15); }
.stars button svg { width: 28px; height: 28px; }
.stars button.on { color: var(--star); }
.stars button.on svg { fill: var(--star); }
.send {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; margin-top: 26px; padding: 16px;
  background: linear-gradient(120deg, var(--brand), var(--brand-2)); color: #fff;
  border: none; border-radius: 16px;
  font: inherit; font-weight: 700; font-size: 1.02rem; cursor: pointer; text-decoration: none;
  box-shadow: 0 14px 26px -14px var(--brand-2);
  transition: transform .15s, box-shadow .15s;
}
.send:hover { transform: translateY(-2px); box-shadow: 0 18px 30px -14px var(--brand-2); }
.send svg { width: 20px; height: 20px; fill: currentColor; }
.note { margin-top: 12px; color: var(--danger); min-height: 1.2em; font-size: .9rem; font-weight: 500; }

.done { text-align: center; max-width: 520px; margin: 40px auto 10px; }
.done .circle { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px; background: linear-gradient(120deg, #34d399, #22c55e); color: #fff; box-shadow: 0 14px 30px -14px #22c55e; }
.done .circle svg { width: 40px; height: 40px; stroke-width: 2.4; }
.done p { color: var(--muted); line-height: 1.6; }

footer { text-align: center; margin-top: 28px; }
footer a { color: var(--muted); font-size: .88rem; font-weight: 500; text-decoration: none; margin: 0 8px; }
footer a:hover { color: var(--brand); }
footer a { display: inline-block; white-space: nowrap; margin-top: 6px; }

/* Admin */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px; }
@media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } }
.stat { border-radius: 20px; padding: 18px 20px; color: #fff; }
.stat b { display: block; font-size: 2rem; font-weight: 800; }
.stat span { opacity: .95; font-size: .92rem; }
.stat.s1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
.stat.s2 { background: linear-gradient(135deg, #fb923c, #f97316); }
.stat.s3 { background: linear-gradient(135deg, #f87171, #d9304f); }
.stat.s4 { background: linear-gradient(135deg, #f0815f, #e8503a); }
.tabs { display: flex; gap: 8px; margin: 24px 0 16px; padding: 6px; background: var(--field); border-radius: 999px; overflow-x: auto; }
.tabs button { flex: 1; border: none; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 10px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: #fff; color: var(--text); box-shadow: 0 4px 12px -6px rgba(120,60,20,.4); }
.items { display: grid; gap: 12px; }
.item { display: flex; gap: 14px; align-items: flex-start; border: 2px solid var(--border); border-radius: 18px; padding: 16px 18px; background: #fff; }
.item .ico { width: 44px; height: 44px; border-radius: 14px; background: var(--cbg); color: var(--c); display: grid; place-items: center; flex: none; }
.item .main { flex: 1; min-width: 0; }
.item .ttl { font-weight: 700; font-size: 1.08rem; }
.item .meta { color: var(--muted); font-size: .9rem; margin-top: 6px; }
.badge { font-size: .8rem; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.badge.urgent { background: #ffe1e3; color: #d62839; }
.badge.new { background: #ffedd5; color: #c2410c; }
.badge.review { background: #fff1d6; color: #b45309; }
.badge.closed { background: #dcfce7; color: #15803d; }
.demo { display: inline-block; margin-top: 12px; font-size: .85rem; color: #b45309; background: #fff1d6; padding: 6px 12px; border-radius: 999px; }

/* Telefon uchun */
@media (max-width: 560px) {
  body { padding: 0; background: var(--panel); }
  .shell { border-radius: 0; box-shadow: none; min-height: 100vh; padding-bottom: 24px; }
  header { padding: 16px; gap: 12px; position: sticky; top: 0; z-index: 5; }
  header .logo { width: 40px; height: 40px; border-radius: 12px; }
  header .brand { font-size: 1.2rem; }
  header .tag { font-size: .82rem; }
  .body { padding: 0 16px; }
  h1 { font-size: 1.35rem; margin-top: 20px; }
  p.lead { font-size: .95rem; margin-bottom: 16px; }
  .grid, .langs { gap: 10px; }
  .tile { padding: 14px 16px; border-radius: 16px; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; }
  .tile .ico { width: 46px; height: 46px; border-radius: 14px; grid-row: span 2; }
  .tile .t { font-size: 1.05rem; margin: 0 0 3px; }
  .tile .d { font-size: .86rem; }
  .langs .tile { display: flex; padding: 16px; }
  .form-head .ico { width: 44px !important; height: 44px !important; }
  .rate-row { padding: 8px 12px; }
  .picked { font-size: .9rem; padding: 10px 10px 10px 12px; gap: 8px; }
  .branches button { font-size: .92rem; }
  .stars button svg { width: 26px; height: 26px; }
  input, textarea { font-size: 16px; }
  .send { position: sticky; bottom: 12px; }
  .stats { gap: 10px; }
  .stat { padding: 14px 16px; border-radius: 16px; }
  .stat b { font-size: 1.6rem; }
  .stat span { font-size: .82rem; }
  .tabs { margin: 18px 0 12px; }
  .tabs button { flex: none; padding: 9px 14px; font-size: .9rem; }
  .item { padding: 12px 14px; gap: 12px; flex-wrap: wrap; }
  .item .ico { width: 40px; height: 40px; }
  .item .ttl { font-size: 1rem; }
  .item .main { flex-basis: calc(100% - 60px); }
  .item .badge { margin-left: 52px; }
  footer { margin-top: 22px; }
}

/* ===== Zamonaviy ko'rinish ===== */
:root { --surface: #faf5ef; --line: #eee2d4; --ring: rgba(249,115,22,.16); --shadow: 0 1px 2px rgba(80,40,10,.05), 0 8px 24px -14px rgba(120,60,20,.22); }
.body > section { animation: rise .28s ease-out; }
h1 { letter-spacing: -.02em; }
.back { margin-top: 18px; padding: 8px 12px 8px 8px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--text); font-size: .92rem; box-shadow: 0 1px 2px rgba(80,40,10,.05); }
.back svg { width: 18px; height: 18px; }
.back:hover { border-color: var(--brand); }
.done .back { margin-left: auto; margin-right: auto; }
.admin-top .arefresh { color: var(--brand); }
.tile { border: 1px solid var(--line); box-shadow: var(--shadow); }
.tile:active { transform: scale(.985); }
.label, label { font-size: .86rem; font-weight: 700; color: #5c4535; letter-spacing: .01em; margin: 22px 0 8px; }
input, textarea { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; transition: border-color .15s, box-shadow .15s; }
input:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring); background: #fff; }
.err { border-color: var(--danger) !important; background: #fff !important; box-shadow: 0 0 0 4px rgba(229,56,59,.12) !important; }
.ferr { display: flex; align-items: center; gap: 6px; }
.ferr::before { content: "!"; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--danger); color: #fff; font-size: .7rem; font-weight: 800; flex: none; }
#ratings { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 4px 14px 6px; margin-top: 18px; box-shadow: var(--shadow); }
#ratings .label { margin: 12px 0 4px; }
.rate-row { background: transparent; border-radius: 0; margin: 0; padding: 10px 0; border-top: 1px solid #f4ebe1; }
.rate-row:first-of-type { border-top: 0; }
.rate-row.err { box-shadow: none !important; border-color: #f4ebe1 !important; }
.rate-row.err > span { color: var(--danger); font-weight: 700; }
.rate-row.err .stars button { color: #f3b4b5; }
.branches button { border: 1px solid var(--line); box-shadow: var(--shadow); padding: 14px 16px; border-radius: 16px; }
.branches button::after { content: "›"; margin-left: auto; font-size: 1.4rem; line-height: 1; color: #d3bfae; font-weight: 400; }
.branches button svg { width: 34px; height: 34px; padding: 8px; border-radius: 10px; background: #fff3e8; flex: none; }
.picked { border: 1px solid #fbc89a; background: linear-gradient(120deg, #fff7ef, #fff1e4); }
.send { border-radius: 16px; padding: 17px; letter-spacing: .01em; }
.send:active { transform: scale(.985); }
.done { background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 34px 22px 26px; box-shadow: var(--shadow); }
.done .circle { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
#pinForm { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: var(--shadow); max-width: 380px; }
#pin { max-width: none; letter-spacing: .5em; font-weight: 700; }
#pinForm .send { max-width: none; margin-top: 8px; }
#pinNote:empty { min-height: 0; margin: 0; }
.tsub { display: block; font-size: .74rem; font-weight: 600; color: var(--muted); margin-bottom: 1px; }
/* Sana paneli */
.datebar { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 8px; box-shadow: var(--shadow); gap: 6px; }
.dbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; width: 40px; height: 40px; }

  const $ = id => document.getElementById(id);

  let lang = "uz", cat = "review";
  const scores = { food: 0, service: 0, atmos: 0 };

  // === SOZLAMA: filiallar ro'yxati (nomlarini shu yerda o'zgartiring) ===
  const BRANCHES = [
    { uz: "Labzak filiali",    ru: "Филиал Лабзак",    en: "Labzak branch" },
    { uz: "Drujba filiali",    ru: "Филиал Дружба",    en: "Drujba branch" },
    { uz: "Gulzor filiali",    ru: "Филиал Гулзор",    en: "Gulzor branch" },

    { uz: "Parkent filiali",   ru: "Филиал Паркент",   en: "Parkent branch" }
  ];
  let branch = -1;
  function markErr(el, txt) {
    el.classList.add("err");
    if (!txt) return;
    const d = document.createElement("div");
    d.className = "ferr"; d.textContent = txt;
    el.insertAdjacentElement("afterend", d);
  }
  function clearErrs() {
    document.querySelectorAll(".ferr").forEach(e => e.remove());
    document.querySelectorAll(".err").forEach(e => e.classList.remove("err"));
  }
  document.addEventListener("input", e => {
    if (e.target.classList && e.target.classList.contains("err")) {
      e.target.classList.remove("err");
      const n = e.target.nextElementSibling; if (n && n.classList.contains("ferr")) n.remove();
    }
  });
  function renderBranches() {
    $("branches").innerHTML = BRANCHES.map((b, i) =>
      `<button type="button" data-b="${i}" class="${i === branch ? "on" : ""}"><img class="bph" src="img/filial-${b.uz.split(" ")[0].toLowerCase()}-2.jpg" alt="" loading="lazy"><svg class="i"><use href="#ic-pin"/></svg><span><b class="cn">${T[lang].center}</b><span class="nw"><i class="dsh">-</i>${b[lang]}</span></span></button>`).join("");
    $("branches").querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
      branch = +btn.dataset.b; renderBranches(); $("note").textContent = "";
    }));
    const isReview = cat === "review";
    $("branchWrap").hidden = !isReview || branch >= 0;
    $("branchPicked").hidden = !isReview || branch < 0;
    $("fields").hidden = isReview && branch < 0;
    if (branch >= 0) $("branchName").innerHTML = '<b class="cn">' + T[lang].center + '</b><span class="nw">-' + BRANCHES[branch][lang] + "</span>";
  }
  $("branchChange").addEventListener("click", () => { branch = -1; renderBranches(); });

  function show(name) {
    ["lang", "home", "form", "done", "pin", "admin", "alist"].forEach(s => $("s-" + s).hidden = s !== name);
    $("langBtn").hidden = !["home", "form", "done"].includes(name);
    document.body.classList.toggle("lm", name === "lang"); // yashil-oltin dizayn faqat til tanlashda
    document.body.classList.toggle("hm", name === "home"); // mavzular: osh rasmi bilan
    document.body.classList.toggle("fm", name === "form");
    if (name !== "admin" && location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search);
    window.scrollTo(0, 0);
  }

  function applyLang(l) {
    lang = l;
    const t = T[l];
    document.documentElement.lang = l;
    document.querySelectorAll(".lrow").forEach(b => b.classList.toggle("sel", b.dataset.lang === l));
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
    document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t[el.dataset.i18nHtml]);
    $("name").placeholder = t.namePh;
    $("msg").placeholder = t.msgPh;
    $("table").placeholder = t.tablePh;
    $("langBtn").innerHTML = '<svg class="i" style="width:20px;height:20px"><use href="#ic-globe"/></svg>';
    $("langBtn").setAttribute("aria-label", "Language");
    setCat(cat);
  }

  function setCat(c) {
    cat = c;
    const t = T[lang];
    $("formTitle").textContent = t["c_" + c + "_t"];
    $("formDesc").textContent = t["c_" + c + "_d"];
    $("formIcon").innerHTML = '<use href="#' + ICONS[c] + '"/>';
    $("formHead").dataset.cat = c;
    $("ratings").hidden = c !== "review";
    renderBranches();
    $("companyWrap").hidden = c !== "partner";
    $("tableWrap").hidden = c !== "review";
    clearErrs();
    $("note").textContent = "";
  }

  // Stars
  document.querySelectorAll(".rate-row").forEach(row => {
    const box = row.querySelector(".stars");
    for (let v = 1; v <= 5; v++) {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("aria-label", v + "/5");
      b.innerHTML = '<svg class="i"><use href="#ic-star"/></svg>';
      b.addEventListener("click", () => {
        scores[row.dataset.key] = v;
        if (row.classList.contains("err")) { row.classList.remove("err"); const n = row.nextElementSibling; if (n && n.classList.contains("ferr")) n.remove(); }
        [...box.children].forEach((s, i) => s.classList.toggle("on", i < v));
      });
      box.appendChild(b);
    }
  });

  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    applyLang(b.dataset.lang);
    show("home");
  }));
  $("langBtn").addEventListener("click", () => show("lang"));
  document.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
    branch = -1;
    setCat(b.dataset.cat);
    show("form");
  }));
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const t = T[lang], m = t.m;
    const name = $("name").value.trim();
    const phone = $("phone").value.trim();
    const company = $("company").value.trim();
    const msg = $("msg").value.trim();
    const table = $("table").value.trim();

    // Hamma maydonlar majburiy
    clearErrs();
    const bad = [];
    if (cat === "review") {
      const miss = [...document.querySelectorAll(".rate-row")].filter(row => !scores[row.dataset.key]);
      miss.forEach((row, i) => bad.push([row, i === miss.length - 1 ? t.fillRate : ""]));
    }
    if (!name) bad.push([$("name"), t.fill]);
    if (!phone) bad.push([$("phone"), t.fill]);
    if (cat === "review" && !table) bad.push([$("table"), t.fill]);
    if (cat === "partner" && !company) bad.push([$("company"), t.fill]);
    if (!msg) bad.push([$("msg"), t.fill]);
    if (bad.length) {
      bad.forEach(([el, txt]) => markErr(el, txt));
      bad[0][0].scrollIntoView({ behavior: "smooth", block: "center" });
      if (bad[0][0].focus && bad[0][0].tagName !== "DIV") bad[0][0].focus({ preventScroll: true });
      return;
    }

    let text = m.head + "\n" + m.cat + ": " + t["c_" + cat + "_t"] + "\n" + m.lang + ": " + t.code + "\n";
    if (cat === "review" && branch < 0) { $("note").textContent = t.needBranch; return; }
    if (cat === "review") text += m.branch + ": " + t.center + "-" + BRANCHES[branch][lang] + "\n";
    if (cat === "review") {
      const r = [["food", t.r_food], ["service", t.r_service], ["atmos", t.r_atmos]]
        .filter(([k]) => scores[k])
        .map(([k, label]) => label + " " + "⭐".repeat(scores[k]) + " (" + scores[k] + "/5)");
      if (r.length) text += m.rate + ":\n  " + r.join("\n  ") + "\n";
    }
    if (name) text += m.name + ": " + name + "\n";
    if (phone) text += m.phone + ": " + phone + "\n";
    if (cat === "review" && table) text += m.table + ": " + table + "\n";
    if (cat === "partner" && company) text += m.company + ": " + company + "\n";
    text += "\n" + msg;

    const entry = {
      cat, lang,
      branch: cat === "review" ? BRANCHES[branch].uz.replace(' filiali', '') : "",
      table: cat === "review" ? table : "",
      food: cat === "review" ? scores.food : "",
      service: cat === "review" ? scores.service : "",
      atmos: cat === "review" ? scores.atmos : "",
      name, phone, company: cat === "partner" ? company : "", msg
    };
    // Darhol "rahmat" ekrani; yuborish orqa fonda (xato bo'lsa keyin qayta yuboriladi)
    queueSend(entry, text);

    $("form").reset();
    branch = -1;
    Object.keys(scores).forEach(k => scores[k] = 0);
    document.querySelectorAll(".stars button").forEach(s => s.classList.remove("on"));
    show("done");
  });

  // ===== Saqlash (Google Sheets yoki sinov rejimida shu qurilma) =====
  const LS_KEY = "kamolon_entries";
  function localEntries() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (_) { return []; } }
  async function saveEntry(entry, text) {
    if (API_URL) {
      const r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "add", entry, text }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "save");
      return;
    }
    const all = localEntries();
    all.push({ ...entry, id: Date.now().toString(36), time: new Date().toISOString() });
    try { localStorage.setItem(LS_KEY, JSON.stringify(all)); } catch (_) {}
  }
  // Yuborilmagan xabarlar navbati: internet uzilsa ham yo'qolmaydi
  const OUT_KEY = "kamolon_outbox";
  const inFlight = new Set();
  let retryTimer = null;
  const outbox = () => { try { return JSON.parse(localStorage.getItem(OUT_KEY)) || []; } catch (_) { return []; } };
  const setOutbox = list => { try { localStorage.setItem(OUT_KEY, JSON.stringify(list)); } catch (_) {} };
  function queueSend(entry, text) {
    if (!API_URL) { saveEntry(entry, text); return; }
    const item = { qid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), entry, text };
    setOutbox(outbox().concat(item));
    sendItem(item);
  }
  async function sendItem(item) {
    if (inFlight.has(item.qid)) return;
    inFlight.add(item.qid);
    try {
      const r = await fetch(API_URL, { method: "POST", keepalive: true, body: JSON.stringify({ action: "add", entry: item.entry, text: item.text }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "save");
      setOutbox(outbox().filter(x => x.qid !== item.qid));
    } catch (_) {
      clearTimeout(retryTimer);
      retryTimer = setTimeout(flushOutbox, 15000);
    } finally {
      inFlight.delete(item.qid);
    }
  }
  function flushOutbox() { if (API_URL) outbox().forEach(sendItem); }
  window.addEventListener("online", flushOutbox);
  setTimeout(flushOutbox, 1500);

  async function deleteEntry(pin, cat, id) {
    if (API_URL) {
      const r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "delete", pin, cat, id }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "delete");
      return;
    }
    if (pin !== LOCAL_PIN) throw new Error("pin");
    try { localStorage.setItem(LS_KEY, JSON.stringify(localEntries().filter(x => String(x.id) !== String(id)))); } catch (_) {}
  }
  async function loadEntries(pin) {
    if (API_URL) {
      const r = await fetch(API_URL + "?action=list&pin=" + encodeURIComponent(pin));
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "load");
      return j.entries;
    }
    if (pin !== LOCAL_PIN) throw new Error("pin");
    const res = { review: [], idea: [], partner: [], problem: [] };
    localEntries().slice().reverse().forEach(x => res[x.cat] && res[x.cat].push(x));
    return res;
  }

  // ===== Admin panel =====
  const CAT_NAMES = { review: "Fikr qoldirish", idea: "G'oya taklif qilish", partner: "Hamkorlik", problem: "Rahbariyatga murojaat" };
  const TZ = "Asia/Tashkent";
  let adminPin = "", adminData = null;
  // Joriy ko'rinish: qaysi sana, bo'lim va filial (yangilaganda shu joyda qoladi)
  let view = { screen: "admin", cat: null, br: null, date: null, to: null };
  try {
    adminPin = sessionStorage.getItem("kamolon_pin") || "";
    view = Object.assign(view, JSON.parse(sessionStorage.getItem("kamolon_view") || "{}"));
  } catch (_) {}
  const saveView = () => { try { sessionStorage.setItem("kamolon_view", JSON.stringify(view)); } catch (_) {} };
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dayKey = d => new Date(d).toLocaleDateString("en-CA", { timeZone: TZ });
  const today = () => dayKey(Date.now());
  const curDate = () => view.date || today();
  function fmtTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    return d.toLocaleTimeString("ru-RU", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  }
  function fmtDay(k) {
    const [y, m, d] = k.split("-");
    return d + "." + m + "." + y + (k === today() ? " (bugun)" : "");
  }
  const stars = n => n ? "★".repeat(+n) + "☆".repeat(5 - n) : "—";
  // Bitta kun yoki oraliq (dan — gacha)
  const isRange = () => !!view.to;
  const ofDay = list => (list || []).filter(x => {
    const k = dayKey(x.time);
    return isRange() ? (k >= curDate() && k <= view.to) : k === curDate();
  });

  $("adminDot2").addEventListener("click", () => $("adminDot").click());
  $("adminDot").addEventListener("click", () => {
    if (adminPin) loadAdmin(); else { $("pin").value = ""; $("pinNote").textContent = ""; show("pin"); setTimeout(() => $("pin").focus(), 50); }
  });
  $("pinForm").addEventListener("submit", e => {
    e.preventDefault();
    adminPin = $("pin").value.trim();
    view = { screen: "admin", cat: null, br: null, date: null, to: null };
    loadAdmin();
  });
  $("adminExit").addEventListener("click", () => {
    adminPin = ""; adminData = null;
    try { sessionStorage.removeItem("kamolon_pin"); sessionStorage.removeItem("kamolon_view"); } catch (_) {}
    show("lang");
  });
  $("adminRefresh").addEventListener("click", () => loadAdmin());
  $("alistRefresh").addEventListener("click", () => loadAdmin());

  // Sana tanlash
  function setDate(k) {
    view.date = (!k || k === today()) ? null : k;
    if (view.to && curDate() > view.to) view.to = curDate();
    saveView(); render();
  }
  function setTo(k) {
    if (!k) return;
    if (k < curDate()) { view.to = curDate(); view.date = k === today() ? null : k; } else view.to = k;
    saveView(); render();
  }
  document.querySelectorAll(".adateto").forEach(inp => inp.addEventListener("change", () => setTo(inp.value)));
  document.querySelectorAll(".arange").forEach(btn => btn.addEventListener("click", () => {
    if (isRange()) view.to = null;
    else {
      // standart: oxirgi 10 kun
      view.to = curDate();
      const d = new Date(curDate() + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - 9);
      view.date = d.toISOString().slice(0, 10);
    }
    saveView(); render();
  }));
  document.querySelectorAll(".adate").forEach(inp => inp.addEventListener("change", () => setDate(inp.value)));
  document.querySelectorAll(".atoday").forEach(btn => btn.addEventListener("click", () => { view.to = null; setDate(null); }));
  document.querySelectorAll(".aprev").forEach(btn => btn.addEventListener("click", () => shiftDay(-1)));
  document.querySelectorAll(".anext").forEach(btn => btn.addEventListener("click", () => shiftDay(1)));
  function shiftDay(n) {
    const d = new Date(curDate() + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
    const k = d.toISOString().slice(0, 10);
    if (k > today()) return;
    setDate(k);
  }

  async function loadAdmin() {
    $("pinNote").style.color = "var(--muted)";
    $("pinNote").textContent = "Yuklanmoqda...";
    document.querySelectorAll(".arefresh").forEach(b => b.classList.add("spin"));
    try {
      adminData = await loadEntries(adminPin);
    } catch (err) {
      document.querySelectorAll(".arefresh").forEach(b => b.classList.remove("spin"));
      if (String(err.message) !== "pin" && adminData) return; // internet uzilsa, eski ko'rinish qoladi
      adminPin = "";
      try { sessionStorage.removeItem("kamolon_pin"); } catch (_) {}
      $("pinNote").style.color = "";
      $("pinNote").textContent = String(err.message) === "pin" ? "PIN noto'g'ri" : "Yuklab bo'lmadi. Internetni tekshiring.";
      show("pin");
      return;
    }
    document.querySelectorAll(".arefresh").forEach(b => b.classList.remove("spin"));
    $("pinNote").textContent = "";
    try { sessionStorage.setItem("kamolon_pin", adminPin); } catch (_) {}
    render();
  }

  function render() {
    if (!adminData) return;
    const k = curDate();
    document.querySelectorAll(".adate").forEach(inp => { inp.value = k; inp.max = today(); });
    document.querySelectorAll(".adaylabel").forEach(el => el.textContent = isRange() ? fmtDay(k).replace(" (bugun)", "") : fmtDay(k));
    document.querySelectorAll(".atoday").forEach(el => el.hidden = !view.date && !view.to);
    document.querySelectorAll(".datebar").forEach(el => el.classList.toggle("range", isRange()));
    document.querySelectorAll(".adateto").forEach(inp => { inp.value = view.to || ""; inp.max = today(); });
    document.querySelectorAll(".atolabel").forEach(el => el.textContent = view.to ? fmtDay(view.to).replace(" (bugun)", "") : "");
    document.querySelectorAll(".arange").forEach(el => el.textContent = isRange() ? "✕ Oraliq" : "Oraliq");
    document.querySelectorAll(".anext").forEach(el => el.disabled = k >= today());
    if (view.screen === "alist" && view.cat) renderList(); else renderAdmin();
  }

  function renderAdmin() {
    view.screen = "admin"; view.cat = null; view.br = null; saveView();
    $("adminMode").hidden = !!API_URL;
    $("adminMode").textContent = "Sinov rejimi: faqat shu qurilmadagi murojaatlar ko'rinadi";
    $("adminTiles").innerHTML = Object.keys(CAT_NAMES).map(c => `
      <button class="tile" data-acat="${c}" data-cat="${c}">
        <div class="ico"><svg class="i"><use href="#${ICONS[c]}"/></svg></div>
        <div class="t">${CAT_NAMES[c]}</div>
        <div class="d"><span class="count">${ofDay(adminData[c]).length}</span> ta feedback</div>
      </button>`).join("");
    $("adminTiles").querySelectorAll("[data-acat]").forEach(b => b.addEventListener("click", () => {
      view.screen = "alist"; view.cat = b.dataset.acat; view.br = null; saveView(); renderList(); window.scrollTo(0, 0);
    }));
    if ($("s-admin").hidden) show("admin");
  }

  $("alistBack").addEventListener("click", () => {
    if (view.cat === "review" && view.br) view.br = null; else { view.screen = "admin"; view.cat = null; }
    saveView(); render(); window.scrollTo(0, 0);
  });

  function renderList() {
    const c = view.cat, br = view.br;
    let list = ofDay(adminData[c]);
    $("alistHead").dataset.cat = c;
    $("alistIcon").innerHTML = '<use href="#' + ICONS[c] + '"/>';
    $("alistTitle").textContent = CAT_NAMES[c];
    // Fikrlar: avval filiallar ro'yxati
    if (c === "review" && !br) {
      $("items").innerHTML = BRANCHES.map(b => {
        const key = b.uz.replace(" filiali", "");
        const n = list.filter(x => x.branch === key).length;
        return `<button class="tile" data-br="${esc(key)}" data-cat="review">
          <div class="ico"><svg class="i"><use href="#ic-pin"/></svg></div>
          <div class="t"><small class="tsub">Kamolon Osh markazi</small>${esc(b.uz)}</div>
          <div class="d"><span class="count">${n}</span> ta feedback</div>
        </button>`;
      }).join("");
      $("items").querySelectorAll("[data-br]").forEach(btn => btn.addEventListener("click", () => {
        view.br = btn.dataset.br; saveView(); renderList(); window.scrollTo(0, 0);
      }));
    } else {
      if (c === "review") { list = list.filter(x => x.branch === br); $("alistTitle").textContent = br + " filiali"; }
      $("items").innerHTML = list.length ? list.map(x => `
        <div class="entry" data-id="${esc(x.id)}">
          <div class="emenu"><button class="edots" type="button" aria-label="Menyu">⋮</button>
            <div class="epop"><button class="edel" type="button">🗑 O'chirish</button></div></div>
          <div class="echips">
            <span class="chip when">🕒 ${isRange() ? fmtDay(dayKey(x.time)).replace(" (bugun)", "") + " · " : ""}${fmtTime(x.time)}</span>
            ${x.table ? `<span class="chip">Stol ${esc(x.table)}</span>` : ""}
            ${x.branch && c !== "review" ? `<span class="chip">${esc(x.branch)}</span>` : ""}
          </div>
          ${c === "review" ? `<div class="rates"><span>Taom <i>${stars(x.food)}</i></span><span>Xizmat <i>${stars(x.service)}</i></span><span>Muhit <i>${stars(x.atmos)}</i></span></div>` : ""}
          <div class="msg">${esc(x.msg)}</div>
          <div class="who"><span class="ava">${esc(String(x.name || "?").trim().charAt(0).toUpperCase())}</span><div><b>${esc(x.name)}</b>${x.company ? `<small>${esc(x.company)}</small>` : ""}</div><a class="call" href="tel:${esc(String(x.phone).replace(/[^+\d]/g, ""))}">📞 ${esc(x.phone)}</a></div>
        </div>`).join("") : '<p class="lead">${isRange() ? "Bu kunlarda" : "Bu kunda"} feedback yo\'q.</p>';
    }
    if ($("s-alist").hidden) show("alist");
  }

  // ⋮ menyu: o'chirish
  $("items").addEventListener("click", async e => {
    const dots = e.target.closest(".edots"), del = e.target.closest(".edel");
    if (dots) {
      const m = dots.parentElement, was = m.classList.contains("open");
      document.querySelectorAll(".emenu.open").forEach(x => x.classList.remove("open"));
      if (!was) m.classList.add("open");
      return;
    }
    if (!del) return;
    const card = del.closest(".entry"), id = card.dataset.id, c = view.cat;
    card.querySelector(".emenu").classList.remove("open");
    if (!confirm("Bu murojaatni o'chirasizmi? Uni qaytarib bo'lmaydi.")) return;
    card.classList.add("gone");
    try {
      await deleteEntry(adminPin, c, id);
    } catch (err) {
      card.classList.remove("gone");
      const m = String(err.message);
      alert(m === "pin" ? "PIN noto'g'ri (Apps Script'dagi PIN bilan bir xil emas)" : m === "cat" ? "Apps Script kodi hali eski. Yangi kodni qo'yib, Новая версия bilan qayta joylang." : "O'chirib bo'lmadi: " + m);
      return;
    }
    adminData[c] = (adminData[c] || []).filter(x => String(x.id) !== String(id));
    render();
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".emenu")) document.querySelectorAll(".emenu.open").forEach(x => x.classList.remove("open"));
  });

  // Har daqiqada jimgina yangilanadi; 00:00 da "bugun" o'z-o'zidan yangi kunga o'tadi
  let lastDay = today();
  setInterval(() => {
    const adminOpen = !$("s-admin").hidden || !$("s-alist").hidden;
    if (!adminOpen || !adminPin) return;
    if (today() !== lastDay) { lastDay = today(); render(); }
    loadAdmin();
  }, 60000);

  applyLang("uz");
  // Sahifa yangilansa, admin o'sha joyida ochiladi
  if (adminPin) loadAdmin();
</script>
</body>
</html>
